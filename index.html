<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emmi - The Cutest Giiirl Around!</title>
  <style>
    /* Animated, groovy gradient background with a custom cursor */
    body {
      background: linear-gradient(45deg, #ff66cc, #66ccff, #ffcc66, #ff66cc);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #000080;
      text-align: center;
      margin: 0;
      padding: 0 0 calc(80px + env(safe-area-inset-bottom));
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden; /* Only hide horizontal scrolling */
      overflow-y: auto;   /* Allow vertical scrolling */
      cursor: url('emmi-cursor-small.png'), auto;  /* Custom cursor using Emmi's image */
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    /* Header styling with a neon glow effect */
    h1 {
      font-size: 3em;
      margin: 20px 0;
      text-shadow: 2px 2px #ff0000;
    }
    
    /* Blinking text effect */
    .blink {
      font-size: 1.5em;
      animation: blinker 1s linear infinite;
    }
    @keyframes blinker {
      50% { opacity: 0; }
    }
    
    /* Marquee style for scrolling text */
    .marquee {
      background-color: #ffff00;
      overflow: hidden;
      position: relative;
      color: #000;
      font-weight: bold;
      padding: 10px 0;
    }
    .marquee p {
      position: absolute;
      width: 100%;
      animation: marquee 8s linear infinite;
      white-space: nowrap;
    }
    @keyframes marquee {
      0% { left: 100%; }
      100% { left: -100%; }
    }
    
    /* A pile of colorful snapshots, with room to peek at every photo. */
    .img-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 12px 0;
      max-width: 1100px;
      margin: 0 auto;
      padding: 35px 35px 60px;
      isolation: isolate;
    }
    .img-gallery img {
      --tilt: -8deg;
      --offset: 0px;
      --paper: #ffff00;
      position: relative;
      width: 220px;
      height: auto;
      box-sizing: border-box;
      margin: 8px -5px;
      border: 9px solid var(--paper);
      border-bottom-width: 28px;
      background: var(--paper);
      box-shadow: 5px 7px 0 #000080, 9px 13px 15px #00000040;
      transform: translateY(var(--offset)) rotate(var(--tilt));
      transition: transform 180ms ease, box-shadow 180ms ease;
    }
    .img-gallery img:nth-child(5n + 2) {
      --tilt: 10deg;
      --offset: 18px;
      --paper: #ff66cc;
      width: 190px;
    }
    .img-gallery img:nth-child(5n + 3) {
      --tilt: -4deg;
      --offset: -12px;
      --paper: #66ccff;
      width: 260px;
    }
    .img-gallery img:nth-child(5n + 4) {
      --tilt: 13deg;
      --offset: 22px;
      --paper: #ffcc66;
      width: 205px;
    }
    .img-gallery img:nth-child(5n) {
      --tilt: -12deg;
      --paper: #fff;
      width: 240px;
    }
    @media (hover: hover) {
      .img-gallery img:hover {
        z-index: 2;
        transform: translateY(-12px) rotate(0deg) scale(1.08);
        box-shadow: 7px 10px 0 #000080, 12px 18px 20px #00000040;
      }
    }
    @media (max-width: 600px) {
      h1 { font-size: 2.2em; padding: 0 12px; }
      .img-gallery { padding: 25px 25px 45px; gap: 20px 0; }
      .img-gallery img:nth-child(n) {
        width: 48%;
        margin: 5px 0;
        border-width: 5px;
        border-bottom-width: 18px;
      }
    }
    
    /* Floating cat element animation */
    .floating-cat {
      position: absolute;
      width: 100px;
      height: 100px;
      object-fit: cover;
      z-index: 10;
      pointer-events: none;
      animation: floatAround 6s ease-in-out infinite;
    }
    @keyframes floatAround {
      0%   { top: 80%; left: 10%; transform: rotate(0deg); }
      25%  { top: 20%; left: 70%; transform: rotate(45deg); }
      50%  { top: 60%; left: 50%; transform: rotate(90deg); }
      75%  { top: 10%; left: 20%; transform: rotate(135deg); }
      100% { top: 80%; left: 10%; transform: rotate(180deg); }
    }
    
    /* Extra animated funky shape for extra flair */
    .funky-shape {
      pointer-events: none;
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: #ff00ff;
      border-radius: 50%;
      opacity: 0.7;
      animation: moveAround 10s linear infinite;
    }
    @keyframes moveAround {
      0%   { top: 0; left: 0; }
      25%  { top: 0; left: 90%; }
      50%  { top: 80%; left: 90%; }
      75%  { top: 80%; left: 0; }
      100% { top: 0; left: 0; }
    }
    
    /* Footer styling */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background-color: #333;
      color: #fff;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      font-size: 0.8em;
    }
    .footer p { margin: 0; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) {
      /* Keep the two floating decorations moving; reduce the other effects. */
      body, .blink, .marquee p { animation: none; }
      .img-gallery img { transition: none; }
      .marquee p { position: static; margin: 0; white-space: normal; }
    }
  </style>
</head>
<body>
  <h1>Welcome to Emmi's Wacky World!</h1>
  <p class="blink">emmi spelled backwards is still imme!</p>
  <div class="marquee">
    <p>Keep it funky, keep it cool, Emmi rules all around!</p>
  </div>
  
  <h2>Meet Emmi</h2>
  <div class="img-gallery">
    <img src="thumbs/emmi-1.webp" alt="Emmi Picture 1" width="600" height="450" decoding="async">
    <img src="thumbs/emmi-2.webp" alt="Emmi Picture 2" width="600" height="800" decoding="async">
    <img src="thumbs/emmi-3.webp" alt="Emmi Picture 3" width="600" height="800" decoding="async">
    <img src="thumbs/emmi-4.webp" alt="Emmi Picture 4" width="600" height="800" decoding="async">
    <img src="thumbs/emmi-5.webp" alt="Emmi Picture 5" width="600" height="450" loading="lazy" decoding="async">
    <img src="thumbs/emmi-6.webp" alt="Emmi Picture 6" width="600" height="800" loading="lazy" decoding="async">
    <img src="thumbs/emmi-7.webp" alt="Emmi Picture 7" width="600" height="800" loading="lazy" decoding="async">
    <img src="thumbs/emmi-8.webp" alt="Emmi Picture 8" width="600" height="800" loading="lazy" decoding="async">
    <img src="thumbs/emmi-9.webp" alt="Emmi Picture 9" width="600" height="800" loading="lazy" decoding="async">
    <img src="thumbs/emmi-10.webp" alt="Emmi Picture 10" width="600" height="800" loading="lazy" decoding="async">
  </div>
  
  <!-- Floating Emmi element (animated to move around the page) -->
  <img src="thumbs/emmi-1.webp" class="floating-cat" alt="Floating Emmi" width="100" height="100" decoding="async">
  
  <!-- Extra animated funky shape for extra flair -->
  <div class="funky-shape"></div>
  
  <footer class="footer">
    <p>&copy; 2025 Emmi. All rights reserved.</p>
  </footer>
</body>
</html>
